<!-- Backend/templates/emailVerification.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Email Verification - UNIVIBE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      max-width: 400px;
      width: 100%;
      background: white;
      border-radius: 32px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 32px;
    }

    /* Status Icons */
    .status-container {
      margin: 24px 0 32px;
    }

    .spinner {
      width: 80px;
      height: 80px;
      margin: 0 auto;
      border: 4px solid #e5e7eb;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto;
      background: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .success-icon svg {
      width: 48px;
      height: 48px;
      stroke: white;
      stroke-width: 2;
    }

    .error-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto;
      background: #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: shake 0.5s ease-in-out;
    }

    .error-icon svg {
      width: 48px;
      height: 48px;
      stroke: white;
      stroke-width: 2;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes bounceIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 12px;
    }

    .message {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .email-display {
      background: #f3f4f6;
      padding: 12px 16px;
      border-radius: 12px;
      margin: 20px 0;
      font-size: 14px;
      color: #1f2937;
      word-break: break-all;
    }

    .email-display strong {
      color: #667eea;
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .token-notice {
      background: #ecfdf5;
      border-left: 4px solid #10b981;
      padding: 12px 16px;
      border-radius: 8px;
      margin: 16px 0;
      font-size: 13px;
      color: #065f46;
      text-align: left;
    }

    .button {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin: 8px 0;
    }

    .button-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .button-primary:active {
      transform: scale(0.98);
    }

    .button-secondary {
      background: #f3f4f6;
      color: #4b5563;
    }

    .hidden {
      display: none;
    }

    .note {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">UNIVIBE</div>
    <div class="subtitle">Your Campus, Your Community, Your Vibe.</div>
    
    <div class="status-container">
      <div class="spinner" id="loadingSpinner"></div>
      <div id="successIcon" class="success-icon hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M20 6L9 17L4 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div id="errorIcon" class="error-icon hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <h1 class="title" id="title">Verifying Email...</h1>
    <p class="message" id="message">Please wait while we verify your email address.</p>

    <div id="emailDisplay" class="email-display hidden"></div>
    <div id="tokenNotice" class="token-notice hidden"></div>

    <div id="buttonContainer" class="hidden">
      <button class="button button-primary" id="primaryButton"></button>
      <button class="button button-secondary" id="secondaryButton"></button>
    </div>

    <p class="note" id="noteText">This verification link will expire in 24 hours.</p>
  </div>

  <script>
    // DOM elements
    const loadingSpinner = document.getElementById('loadingSpinner');
    const successIcon = document.getElementById('successIcon');
    const errorIcon = document.getElementById('errorIcon');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const emailDisplay = document.getElementById('emailDisplay');
    const tokenNotice = document.getElementById('tokenNotice');
    const buttonContainer = document.getElementById('buttonContainer');
    const primaryButton = document.getElementById('primaryButton');
    const secondaryButton = document.getElementById('secondaryButton');
    const noteText = document.getElementById('noteText');

    const token = window.location.pathname.split('/').pop();

    function showLoading(text = 'Verifying email...') {
      loadingSpinner.classList.remove('hidden');
      successIcon.classList.add('hidden');
      errorIcon.classList.add('hidden');
      title.textContent = 'Verifying Email...';
      message.textContent = text;
      emailDisplay.classList.add('hidden');
      tokenNotice.classList.add('hidden');
      buttonContainer.classList.add('hidden');
    }

    function showSuccess(data) {
      loadingSpinner.classList.add('hidden');
      successIcon.classList.remove('hidden');
      errorIcon.classList.add('hidden');
      title.textContent = 'Email Verified! ✓';
      title.style.color = '#10b981';
      message.textContent = data.message || 'Your email has been verified successfully.';
      
      if (data.user && data.user.email) {
        emailDisplay.innerHTML = '<strong>Verified Email</strong>' + data.user.email;
        emailDisplay.classList.remove('hidden');
      }

      if (data.token) {
        try {
          if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify({
              type: 'EMAIL_VERIFIED',
              token: data.token,
              user: data.user
            }));
            
            tokenNotice.innerHTML = '✓ Verification successful! Redirecting...';
            tokenNotice.classList.remove('hidden');
            
            setTimeout(() => {
              window.ReactNativeWebView.postMessage(JSON.stringify({
                type: 'CLOSE_WEBVIEW'
              }));
            }, 1500);
          }
        } catch (error) {
          console.log('Not in React Native context');
        }
      }
      
      buttonContainer.classList.add('hidden');
      noteText.textContent = 'You can now access all features of UNIVIBE.';
    }

    function showError(data) {
      loadingSpinner.classList.add('hidden');
      successIcon.classList.add('hidden');
      errorIcon.classList.remove('hidden');
      title.textContent = 'Verification Failed ✗';
      title.style.color = '#ef4444';
      message.textContent = data.message || 'Something went wrong.';
      
      if (data.code === 'TOKEN_EXPIRED') {
        primaryButton.textContent = 'Resend Verification Email';
        primaryButton.onclick = () => promptResendVerification();
        secondaryButton.textContent = 'Back to Login';
        secondaryButton.onclick = () => {
          if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify({
              type: 'CLOSE_WEBVIEW'
            }));
          }
        };
        buttonContainer.classList.remove('hidden');
      }
      
      noteText.textContent = 'Please try again or contact support.';
    }

    async function verifyEmail() {
      if (!token || token === 'verify-email') {
        showError({ message: 'Invalid verification link.' });
        return;
      }

      showLoading();

      try {
        const apiUrl = window.location.origin + '/api/auth/verify-email-api/' + token;
        const response = await fetch(apiUrl, {
          headers: { 'Accept': 'application/json' }
        });
        const data = await response.json();
        
        if (data.success) {
          showSuccess(data);
        } else {
          showError(data);
        }
      } catch (error) {
        showError({ message: 'Network error. Please check your connection.' });
      }
    }

    document.addEventListener('DOMContentLoaded', verifyEmail);
  </script>
</body>
</html>
